# Railway / Nixpacks build definition.
#
# The release phase runs migrations before the new container takes traffic, so
# a deploy can never serve code against an older schema. `db:seed --if-empty`
# populates a brand-new database once and then no-ops on every later deploy —
# a redeploy will not duplicate demo data.

[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
# `--include=dev` is not redundant: Railway sets NODE_ENV=production, under
# which npm omits devDependencies. The build needs them (typescript, tailwind)
# and so does the release phase — `db:seed` runs through tsx, a devDependency.
cmds = ["npm ci --include=dev --no-audit --no-fund"]

[phases.build]
cmds = ["npm run build"]

[start]
# Mirrored by `deploy.startCommand` in railway.json, which takes precedence over
# this block. Change both together, or the one you edit may not be the one that
# runs.
cmd = "npm run release && npm run start"
